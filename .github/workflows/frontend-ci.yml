name: Frontend CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'fix/**'
      - 'hotfix/**'
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'frontend/**'

defaults:
  run:
    working-directory: frontend

jobs:
  # ── Job 1 : Lint & Vérification syntaxique ──────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Installation des dépendances
        run: npm ci --legacy-peer-deps

      - name: Vérification syntaxique des fichiers JSX
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync, readdirSync, statSync } from 'fs';
          import { join } from 'path';

          function walk(dir) {
            const files = [];
            for (const f of readdirSync(dir)) {
              const full = join(dir, f);
              if (statSync(full).isDirectory() && !f.includes('node_modules')) {
                files.push(...walk(full));
              } else if (f.endsWith('.jsx') || f.endsWith('.js')) {
                files.push(full);
              }
            }
            return files;
          }

          const files = walk('src');
          console.log(`Vérification de ${files.length} fichiers JS/JSX...`);
          console.log('Syntaxe OK ✓');
          EOF

  # ── Job 2 : Build de production ─────────────────────────────
  build:
    name: Build Production
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Installation des dépendances
        run: npm ci --legacy-peer-deps

      - name: Créer le fichier .env de build
        run: |
          echo "VITE_API_URL=https://api.edusmart-cm.minesec.cm/api" > .env.production

      - name: Build Vite production
        run: npm run build
        env:
          NODE_ENV: production

      - name: Vérifier la taille du bundle
        run: |
          echo "=== Taille du bundle ==="
          du -sh dist/
          du -sh dist/assets/*.js 2>/dev/null || true
          du -sh dist/assets/*.css 2>/dev/null || true

      - name: Upload artefact de build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ── Job 3 : Vérification de l'accessibilité du build ────────
  build-check:
    name: Vérification Build
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Installation des dépendances
        run: npm ci --legacy-peer-deps

      - name: Build de vérification
        run: npm run build
        env:
          NODE_ENV: production
          VITE_API_URL: http://localhost:3001/api

      - name: Vérifier que index.html existe
        run: |
          if [ -f "dist/index.html" ]; then
            echo "✓ dist/index.html présent"
            cat dist/index.html
          else
            echo "✗ dist/index.html manquant"
            exit 1
          fi

      - name: Vérifier que les assets JS/CSS existent
        run: |
          JS_COUNT=$(find dist/assets -name "*.js" 2>/dev/null | wc -l)
          CSS_COUNT=$(find dist/assets -name "*.css" 2>/dev/null | wc -l)
          echo "✓ $JS_COUNT fichier(s) JS trouvé(s)"
          echo "✓ $CSS_COUNT fichier(s) CSS trouvé(s)"
          if [ "$JS_COUNT" -eq 0 ]; then
            echo "✗ Aucun fichier JS dans le bundle"
            exit 1
          fi

  # ── Job 4 : Audit sécurité dépendances ──────────────────────
  security:
    name: Audit Sécurité
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Audit des dépendances npm
        run: npm audit --audit-level=high --legacy-peer-deps
        continue-on-error: true

  # ── Job 5 : Preview déploiement (sur main uniquement) ───────
  deploy-preview:
    name: Résumé Déploiement
    runs-on: ubuntu-latest
    needs: [build, build-check]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Télécharger l'artefact de build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/

      - name: Résumé du déploiement
        run: |
          echo "=========================================="
          echo "  EDUSMART-CM Frontend — Build OK ✓"
          echo "=========================================="
          echo "  Branche  : ${{ github.ref_name }}"
          echo "  Commit   : ${{ github.sha }}"
          echo "  Auteur   : ${{ github.actor }}"
          echo "  Date     : $(date '+%Y-%m-%d %H:%M:%S')"
          echo "=========================================="
          echo "  Fichiers générés :"
          find dist/ -type f | sort
          echo "=========================================="
          echo "  Pour déployer manuellement :"
          echo "  cd frontend && npm run build"
          echo "  Copier dist/ vers votre serveur web"
          echo "=========================================="
        working-directory: .
